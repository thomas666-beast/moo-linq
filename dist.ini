name    = Moo-LINQ
author  = Thomas
license = Perl_5
copyright_holder = Thomas
copyright_year   = 2026

[Git::NextVersion]
first_version   = 0.12
version_regexp  = ^v?([0-9]+\.[0-9]+)$
release_branch  = main

[GatherDir]
exclude_filename = Makefile.PL
exclude_filename = META.json

[@Filter]
-bundle = @Basic
-remove = GatherDir

[MetaJSON]

[PruneFiles]
match = ^\.gitignore$
match = ^dist\.ini$
match = ^cpanfile$
match = ^cpanfile\.snapshot$
match = ^bench/.*$

[CopyFilesFromBuild]
copy = Makefile.PL
copy = META.json

[ReadmeMarkdownFromPod]
[ReadmeFromPod]

[MetaProvides::Package]
inherit_version = 0
inherit_missing = 1

[MetaResources]
repository     = https://github.com/you/Moo-LINQ
homepage       = https://github.com/you/Moo-LINQ
bugtracker.web = https://github.com/you/Moo-LINQ/issues
license        = http://dev.perl.org/licenses/

[PodSyntaxTests]
[Test::Compile]
[Test::ReportPrereqs]

[Git::Check]
allow_dirty = dist.ini
allow_dirty = Changes
allow_dirty = cpanfile
allow_dirty = cpanfile.snapshot

[Git::Commit]
allow_dirty = dist.ini
allow_dirty = Changes
commit_msg  = v%v

[Git::Tag]
tag_format = v%v

[Git::Push]
push_to = origin main

[UploadToCPAN]
